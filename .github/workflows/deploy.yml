name: CampusHub CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate PHP Syntax
        run: |
          find . -name "*.php" -exec php -l {} +

      - name: Deploy Application
        run: |
          echo "Menjalankan deployment..."
          echo "Deployment berhasil!"
