services:
  web:
    build: .
    ports:
      - "8080:80"
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: campushub
    ports:
      - "3307:3306"
    volumes:
      - ./database/campushub.sql:/docker-entrypoint-initdb.d/campushub.sql
